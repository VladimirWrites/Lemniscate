plugins {
    alias(libs.plugins.android.library)
    id 'jacoco'
}

version = '2.1.0'

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

android {
    namespace = "com.vlad1m1r.lemniscate"
    compileSdk = 37
    compileSdkMinor = 1

    defaultConfig {
        minSdk = 23
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                    // Without this, JaCoCo instruments the JVM's runtime-generated
                    // reflection/serialization accessors and the test worker dies with
                    // NoClassDefFoundError: jdk/internal/reflect/GeneratedSerializationConstructorAccessor1
                    excludes = ["jdk.internal.*"]
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.truth
    testImplementation libs.robolectric
}
